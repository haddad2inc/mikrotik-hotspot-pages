<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="color-scheme" content="dark only">
    <title>عينان نت - تم الدخول بنجاح</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-gradient-start: #0b1120;
            --bg-gradient-end: #19223b;
            --card-bg: rgba(15, 25, 45, 0.75);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-primary: #f0f3fa;
            --text-secondary: #b9c3e6;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.5);
            --shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Inter', system-ui, 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* خلفية ضوئية متحركة */
        .bg-orbs {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orbs::before, .bg-orbs::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: floatOrb 18s infinite ease-in-out;
        }
        .bg-orbs::before {
            width: 380px; height: 380px;
            background: var(--accent);
            top: -100px; right: -100px;
        }
        .bg-orbs::after {
            width: 320px; height: 320px;
            background: var(--success);
            bottom: -80px; left: -80px;
            animation-delay: -9s;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-40px, 40px) scale(1.15); }
        }

        /* البطاقة الزجاجية */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2.2rem;
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            position: relative;
            z-index: 1;
            animation: cardEnter 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* أيقونة النجاح */
        .success-icon-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid var(--success);
            opacity: 0.3;
            animation: ringPulse 2s infinite ease-out;
        }
        .success-ring:nth-child(2) { animation-delay: 0.5s; }
        @keyframes ringPulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .success-circle {
            position: relative;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px -5px var(--success-glow), 0 0 0 6px rgba(16, 185, 129, 0.15);
            animation: successPop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.5) 0.2s both;
        }
        @keyframes successPop {
            0% { transform: scale(0); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .success-circle svg {
            width: 50px;
            height: 50px;
            stroke: #fff;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .success-circle svg path {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.5s ease-out 0.6s forwards;
        }
        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        /* اسم الشبكة */
        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: 0.4rem;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.6rem;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        /* شريط التقدم */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            border-radius: 20px;
            animation: fillProgress 2s linear forwards;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        @keyframes fillProgress {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* العد التنازلي */
        .countdown-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .countdown-text span {
            color: var(--accent);
            font-weight: 700;
            font-size: 1rem;
        }

        /* مؤشر الاتصال */
        .wifi-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 1.2rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .wifi-dots {
            display: inline-flex;
            gap: 4px;
        }
        .wifi-dots span {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: dotPulse 1.4s infinite;
        }
        .wifi-dots span:nth-child(2) { animation-delay: 0.2s; }
        .wifi-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
            30% { opacity: 1; transform: scale(1.3); }
        }

        /* زر التوجيه اليدوي */
        .fallback-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.85rem 1.6rem;
            border-radius: 2rem;
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            color: #fff !important;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 8px 20px -5px var(--accent-glow);
            transition: all 0.25s ease;
            width: 100%;
            margin-top: 0.5rem;
        }
        .fallback-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -5px var(--accent-glow);
        }
        .fallback-link:active {
            transform: scale(0.98);
        }
        .fallback-link svg {
            width: 18px;
            height: 18px;
        }

        /* توقيع */
        .footer-credit {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.6;
            letter-spacing: 0.3px;
        }

        /* تجاوب الجوال */
        @media (max-width: 480px) {
            .glass-card { padding: 2rem 1.4rem; border-radius: 1.8rem; }
            .brand-name { font-size: 1.6rem; }
            h1 { font-size: 1.15rem; }
            .success-icon-wrap { width: 100px; height: 100px; }
            .success-circle { width: 78px; height: 78px; }
            .success-circle svg { width: 44px; height: 44px; }
        }
    </style>
    <script>
        function startClock() {
            $(if popup == 'true')
            open('$(link-redirect)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
            $(endif)

            // عد تنازلي بصري متزامن مع مهلة الميتا (2 ثانية)
            var countdownEl = document.getElementById('countdownNum');
            var seconds = 2;
            var interval = setInterval(function() {
                seconds--;
                if (countdownEl) {
                    countdownEl.textContent = seconds > 0 ? seconds : 0;
                }
                if (seconds <= 0) clearInterval(interval);
            }, 1000);

            // التوجيه بعد 2.2 ثانية (متزامن مع meta refresh + تأخير بسيط لضمان عرض الحركة)
            setTimeout(function() {
                location.href = unescape('$(link-redirect)');
            }, 1200);
        }
    </script>
</head>
<body onLoad="startClock()">
    <!-- خلفية متحركة -->
    <div class="bg-orbs"></div>

    <div class="glass-card">
        <!-- أيقونة النجاح المتحركة -->
        <div class="success-icon-wrap">
            <div class="success-ring"></div>
            <div class="success-ring"></div>
            <div class="success-circle">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>

        <!-- اسم الشبكة 
        <div class="brand-name">عينان نت</div>-->

        <!-- العنوان الرئيسي -->
        <h1>✓ تم تسجيل الدخول بنجاح</h1>
        <p class="subtitle">جاري توجيهك إلى وجهتك المختارة تلقائياً...</p>

        <!-- شريط التقدم -->
        <div class="progress-container">
            <div class="progress-fill"></div>
        </div>

        <!-- العد التنازلي -->
        <p class="countdown-text">التحويل بعد <span id="countdownNum">2</span> ثانية</p>

        <!-- مؤشر الاتصال 
        <div class="wifi-indicator">
            <span>جاري الاتصال بالإنترنت</span>
            <div class="wifi-dots">
                <span></span><span></span><span></span>
            </div>
        </div>-->

        <!-- زر التحويل اليدوي (Fallback) -->
        <a href="$(link-redirect)" class="fallback-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            الانتقال الآن
        </a>

        <!-- <div class="footer-credit">برمجة وتصميم المهندس/ صلاح الحداد</div>
    </div>
</body>
</html>
