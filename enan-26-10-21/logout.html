<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="color-scheme" content="light dark">
    <title>عينان نت | تسجيل الخروج</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-gradient-start: #0b1120;
            --bg-gradient-end: #19223b;
            --card-bg: rgba(15, 25, 45, 0.75);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-primary: #f0f3fa;
            --accent: #8b5cf6;
            --success: #10b981;
        }
      
        body {
            font-family: 'Inter', system-ui, 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-primary);
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #fff, var(--accent));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .info {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-primary);
            opacity: 0.8;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script language="JavaScript">
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_blank', '');
            window.close();
            return false;
        }
        function submitform() {
            document.getElementById('my').submit();
        }
    </script>
</head>
<body onload="submitform()">
    <div class="glass-card">
        <div class="icon">🔌</div>
        <h1>جاري تسجيل الخروج</h1>
        <div class="spinner"></div>
        <p class="info">سيتم إعادة توجيهك إلى صفحة الدخول تلقائياً...</p>
    </div>
    <form action="$(link-login)" id="my" name="myForm" onSubmit="return openLogin()">
        <!-- لا يوجد محتوى إضافي، النموذج سيبعث تلقائياً -->
    </form>
</body>
</html>
