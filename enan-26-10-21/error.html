<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="color-scheme" content="dark only">
    <title>عينان نت - خطأ</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-gradient-start: #0b1120;
            --bg-gradient-end: #19223b;
            --card-bg: rgba(15, 25, 45, 0.75);
            --text-primary: #f0f3fa;
            --text-secondary: #b9c3e6;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --error: #ef4444;
            --error-glow: rgba(239, 68, 68, 0.5);
        }

        body {
            font-family: system-ui, 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-primary);
        }

        /* الحفاظ على بنية main/wrap الأصلية */
        .ie-fixMinHeight {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .main {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .wrap {
            width: 100%;
            max-width: 420px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2.2rem 1.8rem;
            text-align: center;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.3);
            animation: fadeSlideUp 0.4s ease;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أيقونة الخطأ */
        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--error), #b91c1c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: #fff;
            font-weight: 900;
            box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.15), 0 10px 25px -5px var(--error-glow);
            animation: pulseError 2s infinite ease-in-out;
        }

        @keyframes pulseError {
            0%, 100% { box-shadow: 0 0 0 8px rgba(239,68,68,0.15), 0 10px 25px -5px var(--error-glow); }
            50% { box-shadow: 0 0 0 14px rgba(239,68,68,0.05), 0 15px 30px -5px var(--error-glow); }
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 0.6rem;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .error-detail {
            font-size: 0.95rem;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.25);
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            margin: 0.8rem 0 1.2rem;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .info {
            margin-top: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .info a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 0.4rem;
            padding: 0.55rem 1.4rem;
            border-radius: 2rem;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            transition: 0.2s;
        }

        .info a:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        .brand-footer {
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
            letter-spacing: 0.3px;
        }
    </style>
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <div class="glass-card">
                    <!-- أيقونة الخطأ -->
                    <div class="error-icon">!</div>

                    <!-- العنوان مع الحفاظ على متغير الهوتسبوت الأصلي $(error) -->
                    <h1>حدث خطأ في الشبكة</h1>

                    <!-- نص الخطأ كما هو من المايكروتيك -->
                    <div class="error-detail">$(error)</div>

                    <!-- رابط صفحة الدخول الأصلي $(link-login) -->
                    <p class="info">
                        صفحة تسجيل الدخول:
                        <br>
                        <a href="$(link-login)">اضغط هنا للعودة</a>
                    </p>

                    <div class="brand-footer">عينان نت</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
