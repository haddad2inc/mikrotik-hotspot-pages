<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="refresh" content="2; url=$(link-orig)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="color-scheme" content="light dark">
    <title>عينان نت - إعلان</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-gradient-start: #0b1120;
            --bg-gradient-end: #19223b;
            --card-bg: rgba(15, 25, 45, 0.75);
            --text-primary: #f0f3fa;
            --accent: #8b5cf6;
        }
       
        body {
            font-family: system-ui, 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-primary);
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.8rem; margin-bottom: 1rem; }
        .info { margin-top: 1rem; }
        a { color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
    <script>
        var popup = '';
        function openOrig() {
            if (window.focus) popup.focus();
            location.href = unescape('$(link-orig-esc)');
        }
        function openAd() {
            location.href = unescape('$(link-redirect-esc)');
        }
        function openAdvert() {
            if (window.name != 'hotspot_advert') {
                popup = open('$(link-redirect)', 'hotspot_advert', '');
                setTimeout("openOrig()", 1000);
                return;
            }
            setTimeout("openAd()", 1000);
        }
    </script>
</head>
<body onLoad="openAdvert()">
    <div class="glass-card">
        <h1>📢 إعلان</h1>
        <p class="info">جاري عرض الإعلان ...</p>
        <p class="info">إذا لم يتم التوجيه، <a href="$(link-redirect)" target="hotspot_advert">اضغط هنا</a></p>
    </div>
</body>
</html>
