$(if http-status == 302)Hotspot redirect$(endif)
$(if http-header == "Location")$(link-redirect)$(endif)
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>جاري التوجيه ...</title>
    <meta http-equiv="refresh" content="0; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="color-scheme" content="light dark">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-gradient-start: #0b1120;
            --bg-gradient-end: #19223b;
            --card-bg: rgba(15, 25, 45, 0.75);
            --text-primary: #f0f3fa;
        }
     
        body {
            font-family: system-ui, 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <p>جاري التوجيه إلى الموقع المطلوب ...</p>
    </div>
</body>
</html>
